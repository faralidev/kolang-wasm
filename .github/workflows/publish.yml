name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Used by prepublishOnly → npm run build → scripts/build.sh to find the
      # kolang interpreter source (checked out at ./kolang inside the workspace).
      KOLANG_REPO: ${{ github.workspace }}/kolang
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check out kolang interpreter (for WASM build)
        uses: actions/checkout@v5
        with:
          repository: faralidev/kolang
          path: ./kolang
      - name: Build WASM
        run: npm run build
      - name: Publish
        run: npm publish --provenance --access public